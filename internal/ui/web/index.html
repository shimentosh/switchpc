<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VKVM</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="offline" class="offline" hidden>
  <div class="spinner"></div>
  <p id="offline-text">Connecting to VKVM…</p>
</div>

<header class="topbar">
  <div class="brand">
    <img src="/icon.png" alt="" width="28" height="28">
    <span>VKVM</span>
  </div>
  <div class="who" id="who"></div>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="home" class="active">Home</button>
    <button data-tab="monitors">Monitors</button>
    <button data-tab="computers">Computers</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>

<div id="banner" class="banner" hidden>
  <span id="banner-text"></span>
  <button class="btn small" id="banner-action">Restart now</button>
</div>

<main id="view"></main>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
